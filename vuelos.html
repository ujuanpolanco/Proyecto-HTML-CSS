<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Vuelos disponibles de ACME AIR para la ruta y fecha que buscaste.">
    <title>Vuelos disponibles · ACME AIR</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">

    <!-- Tipografía Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">

    <!-- Hojas de estilo: respetar este orden (responsive siempre al final) -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="app">

    <header class="app-header">
        <img class="app-header__logo" src="img/logo-blanco.svg" alt="ACME AIR · Flying to your dreams">
    </header>

    <main class="app__card">

        <!-- Barra de usuario -->
        <div class="user-bar">
            <img class="user-bar__avatar" src="img/icons/avatar.svg" alt="">
            <div>
                <p class="user-bar__name">John Doe</p>
                <a class="link link--muted" href="index.html">Cerrar Sesión</a>
            </div>
        </div>

        <h1 class="page-title">Vuelos disponibles</h1>

        <div class="vuelos__busqueda">
            <p>Bogotá - Barranquilla</p>
            <p>Septiembre - 29</p>
        </div>

        <ul class="flight-list">
            <li>
                <article class="card flight-card">
                    <img class="flight-card__icon" src="img/icons/avion-despegue.svg" alt="">
                    <div class="flight-card__body">
                        <h2 class="flight-card__number"><span class="visually-hidden">Vuelo </span>VAA025</h2>
                        <p class="flight-card__schedule"><time datetime="05:30">05:30</time> - <time datetime="06:30">06:30</time></p>
                        <p class="flight-card__duration">1h</p>
                        <p class="flight-card__price"><span class="flight-card__currency">COP</span>150.600</p>
                    </div>
                </article>
            </li>
            <li>
                <article class="card flight-card">
                    <img class="flight-card__icon" src="img/icons/avion-despegue.svg" alt="">
                    <div class="flight-card__body">
                        <h2 class="flight-card__number"><span class="visually-hidden">Vuelo </span>VAA412</h2>
                        <p class="flight-card__schedule"><time datetime="10:30">10:30</time> - <time datetime="12:05">12:05</time></p>
                        <p class="flight-card__duration">1h 35 min</p>
                        <p class="flight-card__price"><span class="flight-card__currency">COP</span>260.050</p>
                    </div>
                </article>
            </li>
            <li>
                <article class="card flight-card">
                    <img class="flight-card__icon" src="img/icons/avion-despegue.svg" alt="">
                    <div class="flight-card__body">
                        <h2 class="flight-card__number"><span class="visually-hidden">Vuelo </span>VAA836</h2>
                        <p class="flight-card__schedule"><time datetime="14:15">14:15</time> - <time datetime="15:45">15:45</time></p>
                        <p class="flight-card__duration">1h 30 min</p>
                        <p class="flight-card__price"><span class="flight-card__currency">COP</span>150.600</p>
                    </div>
                </article>
            </li>
        </ul>

        <a class="btn btn--primary" href="menu.html">Volver</a>

    </main>

</body>

</html>
