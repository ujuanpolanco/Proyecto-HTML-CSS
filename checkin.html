<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Haz el check-in de tu próximo vuelo con ACME AIR y elige tu asiento.">
    <title>Check-in · ACME AIR</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">

    <!-- Tipografía Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">

    <!-- Hojas de estilo: respetar este orden (responsive siempre al final) -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="app">

    <header class="app-header app-header--nav">
        <img class="app-header__logo" src="img/logo-blanco.svg" alt="ACME AIR · Flying to your dreams">

        <!-- Menú desplegable: <details> se abre y cierra sin JavaScript -->
        <details class="site-nav">
            <summary class="site-nav__toggle">
                <img class="site-nav__icono site-nav__icono--abrir" src="img/icons/menu-abrir.svg" alt="">
                <img class="site-nav__icono site-nav__icono--cerrar" src="img/icons/menu-cerrar.svg" alt="">
                <span class="visually-hidden">Menú de navegación</span>
            </summary>
            <nav aria-label="Navegación principal">
                <ul class="site-nav__list">
                    <li><a class="site-nav__link" href="menu.html">Menú principal</a></li>
                    <li><a class="site-nav__link" href="buscar-vuelos.html">Buscar vuelos</a></li>
                    <li><a class="site-nav__link" href="checkin.html" aria-current="page">Check In</a></li>
                    <li><a class="site-nav__link" href="mis-vuelos.html">Mis Vuelos</a></li>
                    <li><a class="site-nav__link site-nav__link--salir" href="index.html">Cerrar Sesión</a></li>
                </ul>
            </nav>
        </details>
    </header>

    <main class="app__card">

        <!-- Barra de usuario -->
        <div class="user-bar">
            <img class="user-bar__avatar" src="img/icons/avatar.svg" alt="">
            <div>
                <p class="user-bar__name">John Doe</p>
                <a class="link link--muted" href="index.html">Cerrar Sesión</a>
            </div>
        </div>

        <h1 class="page-title">Check In</h1>

        <!-- Vuelo al que se le hace el check-in -->
        <article class="card flight-card flight-card--checkin checkin__vuelo">
            <img class="flight-card__icon" src="img/icons/avion-despegue.svg" alt="">
            <div class="flight-card__body">
                <h2 class="flight-card__number"><span class="visually-hidden">Vuelo </span>VAA025</h2>
                <p class="flight-card__schedule"><time datetime="05:30">05:30</time> - <time datetime="06:30">06:30</time></p>
                <p class="flight-card__duration">1h</p>
                <p class="flight-card__route">Bogotá - Barranquilla</p>
            </div>
        </article>

        <!-- Contacto en caso de emergencia -->
        <section class="card checkin__contacto" aria-labelledby="titulo-contacto">
            <h2 class="checkin__subtitulo" id="titulo-contacto">Contacto en caso de emergencia</h2>

            <form class="form" action="menu.html">

                <!-- Nombre del contacto -->
                <div class="form__field">
                    <label class="visually-hidden" for="contacto-nombre">Nombre completo del contacto</label>
                    <input class="form__input" id="contacto-nombre" name="contacto-nombre" type="text"
                        placeholder="Nombre completo" required>
                </div>

                <!-- Teléfono del contacto -->
                <div class="form__field">
                    <label class="visually-hidden" for="contacto-telefono">Teléfono celular del contacto</label>
                    <input class="form__input" id="contacto-telefono" name="contacto-telefono" type="tel"
                        placeholder="No. Teléfono Celular" inputmode="tel" required>
                </div>

                <button class="btn btn--primary" type="submit">Guardar</button>

            </form>
        </section>

    </main>

</body>

</html>
